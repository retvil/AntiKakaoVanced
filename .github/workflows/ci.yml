name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest psutil
      - name: Compile check
        run: python -m compileall -q .
      - name: Run tests
        run: python -m pytest tests/test_core.py -q -p no:cacheprovider
